<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the safe-area insets in mobile.css keep content clear of
       the notch and the home indicator. Zoom is deliberately NOT disabled; inputs
       are 16px+ instead, which is what actually stops iOS auto-zooming on focus. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#262624">
  <meta name="color-scheme" content="dark light">
  <title>AIOS · Receipts</title>

  <!-- Add to Home Screen on iOS: standalone chrome, translucent status bar, and a
       name short enough not to be truncated under the icon. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/aios-192.png">
  <link rel="icon" href="/icons/aios.svg">
  <link rel="manifest" href="/mobile.webmanifest">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="m-body">
  <div id="m-app" class="m-app"></div>
  <script type="module" src="/js/mobile/receipts.js"></script>
</body>
</html>
